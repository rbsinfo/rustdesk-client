# Applies the instance configuration to the RustDesk checkout in the workspace.
#
# Expected layout, set up by the calling job:
#   ./            RustDesk sources at the requested tag, with submodules
#   ./_generator  this repository
# The instance (the repository that started the workflow) is checked out here
# into ./_instance.
name: Prepare RustDesk sources
description: Check out the instance and apply its configuration to the RustDesk sources.

inputs:
  instance-path:
    description: Directory of the instance inside its repository.
    default: "."

runs:
  using: composite
  steps:
    - name: Check out the instance
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        path: _instance
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Apply the instance configuration
      shell: bash
      env:
        INSTANCE_PATH: ${{ inputs.instance-path }}
      run: |
        python -m pip install --quiet "pillow==11.3.0"
        python _generator/scripts/apply.py \
          --instance "_instance/${INSTANCE_PATH}" \
          --source . \
          --export-env "$GITHUB_ENV"
